<!-- Drawn at the launcher's banner size (810x200: 1100px window - sidebar - padding). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#1c2a40"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101826" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#101826" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#101826" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="810" height="200" fill="url(#sky)"/>
  <!-- perspective grid floor, horizon at y=120 -->
  <g stroke="#3d8fe6" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="0" y1="120" x2="810" y2="120"/>
    <line x1="0" y1="128" x2="810" y2="128"/>
    <line x1="0" y1="139" x2="810" y2="139"/>
    <line x1="0" y1="154" x2="810" y2="154"/>
    <line x1="0" y1="174" x2="810" y2="174"/>
    <line x1="0" y1="200" x2="810" y2="200"/>
    <line x1="560" y1="120" x2="-300" y2="200"/>
    <line x1="560" y1="120" x2="40" y2="200"/>
    <line x1="560" y1="120" x2="330" y2="200"/>
    <line x1="560" y1="120" x2="560" y2="200"/>
    <line x1="560" y1="120" x2="790" y2="200"/>
    <line x1="560" y1="120" x2="1080" y2="200"/>
    <line x1="560" y1="120" x2="1420" y2="200"/>
  </g>
  <!-- cubes resting on the floor -->
  <g stroke="#101826" stroke-width="3" stroke-linejoin="round">
    <g transform="translate(590 82) scale(0.72)">
      <path d="M0 -60 L70 -20 L0 20 L-70 -20 Z" fill="#7cc0ff"/>
      <path d="M-70 -20 L0 20 L0 100 L-70 60 Z" fill="#3d8fe6"/>
      <path d="M70 -20 L0 20 L0 100 L70 60 Z" fill="#2563b8"/>
    </g>
    <g transform="translate(700 132) scale(0.4)">
      <path d="M0 -60 L70 -20 L0 20 L-70 -20 Z" fill="#ffd166"/>
      <path d="M-70 -20 L0 20 L0 100 L-70 60 Z" fill="#f0a830"/>
      <path d="M70 -20 L0 20 L0 100 L70 60 Z" fill="#c98316"/>
    </g>
    <g transform="translate(480 136) scale(0.3)">
      <path d="M0 -60 L70 -20 L0 20 L-70 -20 Z" fill="#8be28b"/>
      <path d="M-70 -20 L0 20 L0 100 L-70 60 Z" fill="#4caf50"/>
      <path d="M70 -20 L0 20 L0 100 L70 60 Z" fill="#33803a"/>
    </g>
  </g>
  <rect width="810" height="200" fill="url(#fade)"/>
  <!-- text kept above y=160: the launcher's icon overlaps the banner's bottom-left -->
  <g font-family="Segoe UI, Arial, sans-serif" fill="#e8f1ff">
    <text x="34" y="74" font-size="44" font-weight="700">RossEngine</text>
    <text x="36" y="106" font-size="22" font-weight="600" fill="#7cc0ff">Studio</text>
    <text x="36" y="136" font-size="14" fill="#a9b8cc">Build 3D and 2D games in Luau, TypeScript and Python</text>
  </g>
</svg>
