<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 851 315" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#1c2a40"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101826" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#101826" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#101826" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="851" height="315" fill="url(#sky)"/>
  <!-- perspective grid floor -->
  <g stroke="#3d8fe6" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="0" y1="190" x2="851" y2="190"/>
    <line x1="0" y1="205" x2="851" y2="205"/>
    <line x1="0" y1="224" x2="851" y2="224"/>
    <line x1="0" y1="249" x2="851" y2="249"/>
    <line x1="0" y1="281" x2="851" y2="281"/>
    <line x1="425" y1="190" x2="-500" y2="315"/>
    <line x1="425" y1="190" x2="-150" y2="315"/>
    <line x1="425" y1="190" x2="140" y2="315"/>
    <line x1="425" y1="190" x2="425" y2="315"/>
    <line x1="425" y1="190" x2="710" y2="315"/>
    <line x1="425" y1="190" x2="1000" y2="315"/>
    <line x1="425" y1="190" x2="1350" y2="315"/>
  </g>
  <!-- cubes -->
  <g stroke="#101826" stroke-width="3" stroke-linejoin="round">
    <g transform="translate(600 120)">
      <path d="M0 -60 L70 -20 L0 20 L-70 -20 Z" fill="#7cc0ff"/>
      <path d="M-70 -20 L0 20 L0 100 L-70 60 Z" fill="#3d8fe6"/>
      <path d="M70 -20 L0 20 L0 100 L70 60 Z" fill="#2563b8"/>
    </g>
    <g transform="translate(730 190) scale(0.5)">
      <path d="M0 -60 L70 -20 L0 20 L-70 -20 Z" fill="#ffd166"/>
      <path d="M-70 -20 L0 20 L0 100 L-70 60 Z" fill="#f0a830"/>
      <path d="M70 -20 L0 20 L0 100 L70 60 Z" fill="#c98316"/>
    </g>
    <g transform="translate(490 205) scale(0.38)">
      <path d="M0 -60 L70 -20 L0 20 L-70 -20 Z" fill="#8be28b"/>
      <path d="M-70 -20 L0 20 L0 100 L-70 60 Z" fill="#4caf50"/>
      <path d="M70 -20 L0 20 L0 100 L70 60 Z" fill="#33803a"/>
    </g>
  </g>
  <rect width="851" height="315" fill="url(#fade)"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#e8f1ff">
    <text x="48" y="142" font-size="52" font-weight="700">RossEngine</text>
    <text x="50" y="178" font-size="26" font-weight="600" fill="#7cc0ff">Studio</text>
    <text x="50" y="210" font-size="16" fill="#a9b8cc">Build 3D and 2D games in Luau, TypeScript and Python</text>
